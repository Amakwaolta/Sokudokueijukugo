<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>速読英熟語 熟語帳 — 原稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f4ee;
    --paper-line:#d8ded2;
    --ink:#1f2b24;
    --ink-soft:#5b6b5e;
    --indigo:#2e4374;
    --indigo-deep:#1c2c50;
    --shu:#bf3a2c;
    --shu-soft:#e4a79c;
    --gold:#b8923f;
    --card:#fbfaf5;
    --shadow: 0 8px 24px rgba(31,43,36,0.12), 0 2px 6px rgba(31,43,36,0.08);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 64px;}
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:6px 2px 18px;
    border-bottom:2px solid var(--ink);
    margin-bottom:20px;
  }
  .brand h1{
    font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:26px; letter-spacing:.06em; margin:0; color:var(--indigo-deep);
  }
  .brand .sub{font-size:11px; color:var(--ink-soft); letter-spacing:.12em;}
  .navbtn{
    background:none;border:none;color:var(--ink-soft);font-family:'Zen Kaku Gothic New';
    font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px;letter-spacing:.05em;
  }
  .navbtn.active{background:var(--indigo-deep);color:#fff;}
  .navrow{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}

  /* Dashboard */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-card .num{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:28px; color:var(--indigo-deep);
    line-height:1;
  }
  .stat-card .label{font-size:12px; color:var(--ink-soft); margin-top:6px; letter-spacing:.04em;}
  .stat-card.streak .num{color:var(--shu);}

  .section-title{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:15px; color:var(--ink);
    margin:24px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-title::before{content:""; width:16px; height:2px; background:var(--shu); display:inline-block;}

  .mode-card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .mode-card .m-title{font-weight:700; font-size:15px;}
  .mode-card .m-desc{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
  .btn{
    font-family:'Zen Kaku Gothic New'; font-weight:700; border:none; cursor:pointer;
    border-radius:10px; padding:10px 18px; font-size:14px; letter-spacing:.03em;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--indigo-deep); color:#fff;}
  .btn-primary:hover{background:var(--indigo);}
  .btn-outline{background:transparent; border:1.5px solid var(--indigo-deep); color:var(--indigo-deep);}
  .btn-ghost{background:transparent; color:var(--ink-soft); font-weight:500; text-decoration:underline;}
  .btn-shu{background:var(--shu); color:#fff;}

  .range-input{width:78px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:15px; padding:9px 6px;}
  .range-check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .range-check input{width:15px; height:15px; accent-color:var(--indigo-deep);}
  select, input[type=text]{
    font-family:'Zen Kaku Gothic New'; font-size:14px; padding:8px 10px; border-radius:8px;
    border:1.5px solid var(--paper-line); background:#fff; color:var(--ink);
  }

  .settings-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--paper-line); font-size:14px;
  }

  /* Session */
  .progressbar{height:6px; background:var(--paper-line); border-radius:3px; overflow:hidden; margin-bottom:22px;}
  .progressbar-fill{height:100%; background:var(--shu); transition:width .25s ease;}
  .session-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:8px; font-family:'JetBrains Mono',monospace;}

  .card-stage{display:flex; justify-content:center; padding:8px 0 24px;}
  .flashcard{
    width:100%; max-width:420px; min-height:320px; background:var(--card);
    border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--paper-line);
    position:relative; padding:28px 24px; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center; cursor:pointer;
    user-select:none;
  }
  .flashcard .boxtag{
    position:absolute; top:14px; left:16px; font-family:'JetBrains Mono',monospace;
    font-size:10px; color:var(--ink-soft); letter-spacing:.08em; border:1px solid var(--paper-line);
    padding:2px 7px; border-radius:20px;
  }
  .flashcard .idtag{
    position:absolute; top:14px; right:16px; font-family:'JetBrains Mono',monospace;
    font-size:10px; color:var(--ink-soft);
  }
  .word-en{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:34px; color:var(--indigo-deep);
    word-break:break-word; margin-bottom:6px;
  }
  .word-hint{font-size:12px; color:var(--ink-soft); margin-bottom:18px;}
  .meaning{
    font-size:16px; line-height:1.75; color:var(--ink); white-space:pre-wrap; padding-top:10px;
    border-top:1px dashed var(--paper-line); width:100%;
  }
  .tap-hint{font-size:12px; color:var(--ink-soft); margin-top:22px; letter-spacing:.05em;}

  .stamp{
    position:absolute; bottom:14px; right:16px; width:56px; height:56px; border-radius:50%;
    border:2.5px solid var(--shu); color:var(--shu); display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:20px; transform:rotate(-8deg);
    opacity:.9;
  }

  .grade-row{display:flex; gap:10px; justify-content:center; max-width:420px; margin:0 auto; width:100%;}
  .grade-btn{
    flex:1; padding:14px 6px; border-radius:12px; border:none; cursor:pointer; font-family:'Zen Kaku Gothic New';
    font-weight:700; font-size:13px; color:#fff; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .grade-btn .k{font-family:'JetBrains Mono',monospace; font-size:10px; opacity:.75;}
  .grade-again{background:#8a8f86;}
  .grade-good{background:var(--indigo-deep);}
  .grade-easy{background:var(--shu);}

  /* Quiz mode */
  .quiz-choices{display:flex; flex-direction:column; gap:10px; max-width:420px; margin:0 auto; width:100%;}
  .choice-btn{
    text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--paper-line);
    background:var(--card); font-size:14px; line-height:1.5; cursor:pointer; font-family:'Zen Kaku Gothic New';
    color:var(--ink);
  }
  .choice-btn.correct{border-color:var(--indigo-deep); background:#eef1fb;}
  .choice-btn.wrong{border-color:var(--shu); background:#fbeceb;}
  .choice-btn:disabled{cursor:default;}

  /* Session end */
  .end-wrap{text-align:center; padding:40px 0;}
  .end-stamp{
    width:120px; height:120px; border-radius:50%; border:4px solid var(--shu); color:var(--shu);
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px; transform:rotate(-6deg);
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:28px; letter-spacing:.05em;
  }
  .end-title{font-family:'Shippori Mincho',serif; font-weight:700; font-size:20px; margin-bottom:6px;}
  .end-sub{color:var(--ink-soft); font-size:13px; margin-bottom:26px;}
  .end-stats{display:flex; justify-content:center; gap:28px; margin-bottom:30px;}
  .end-stats div .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--indigo-deep);}
  .end-stats div .lb{font-size:11px; color:var(--ink-soft);}

  /* List view */
  .search-bar{display:flex; gap:8px; margin-bottom:14px;}
  .search-bar input{flex:1;}
  .word-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    background:var(--card); border:1px solid var(--paper-line); border-radius:10px; margin-bottom:6px;
  }
  .word-row .w{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; color:var(--indigo-deep); min-width:110px;}
  .word-row .mn{font-size:12px; color:var(--ink-soft); flex:1; margin:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .boxbadge{font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .bb0{background:#eee; color:#888;}
  .bb1{background:#e8ecf6; color:var(--indigo);}
  .bb2{background:#fdf0e6; color:var(--gold);}
  .bb3{background:#fbeceb; color:var(--shu);}
  .accbadge{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft);
    white-space:nowrap; margin-left:6px;
  }

  .empty-note{color:var(--ink-soft); font-size:13px; text-align:center; padding:30px 10px;}

  /* Word book (TOC + pages) */
  .toc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .toc-item{
    background:var(--card); border:1px solid var(--paper-line); border-radius:12px;
    padding:14px 14px; box-shadow:var(--shadow); cursor:pointer;
  }
  .toc-item:active{transform:scale(.97);}
  .toc-range{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--indigo-deep); font-size:15px;}
  .toc-sub{font-size:11px; color:var(--ink-soft); margin-top:4px;}

  .book-crumb{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:12px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .book-crumb a{color:var(--indigo-deep); text-decoration:underline; font-family:'Zen Kaku Gothic New'; font-size:13px;}

  .book-list{display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .book-entry{
    background:var(--card); border:1px solid var(--paper-line); border-radius:12px;
    padding:14px 16px; box-shadow:var(--shadow); position:relative;
  }
  .book-entry-done{border-color:var(--shu-soft); background:#fdfaf6;}
  .book-stamp{
    position:absolute; top:10px; right:12px; width:34px; height:34px; border-radius:50%;
    border:2px solid var(--shu); color:var(--shu); display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:13px; transform:rotate(-10deg); opacity:.9;
  }
  .book-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .book-id{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .book-word{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; color:var(--indigo-deep);}
  .book-meaning{font-size:14px; line-height:1.6; color:var(--ink);}
  .book-acc{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .book-example{margin-top:10px; padding-top:10px; border-top:1px dashed var(--paper-line);}
  .book-ex-en{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); line-height:1.6;}
  .book-ex-ja{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .book-ex-pending{margin-top:10px; padding-top:10px; border-top:1px dashed var(--paper-line); font-size:11.5px; color:var(--ink-soft);}
  .book-nav{display:flex; justify-content:space-between; gap:10px; margin-bottom:30px;}
  .book-nav .btn:disabled{opacity:.35; cursor:default;}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(20,26,20,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--card); border-radius:16px; padding:22px; max-width:340px; width:100%; box-shadow:var(--shadow);}
  .modal h3{font-family:'Shippori Mincho',serif; margin:0 0 10px;}
  .modal p{font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:18px;}
  .modal .row{display:flex; gap:10px; justify-content:flex-end;}

  @media (max-width:420px){
    .word-en{font-size:28px;}
    .flashcard{min-height:290px; padding:22px 18px;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ============ DATA ============ */
const WORDS = [{"id":1,"word":"be late for ～","meaning":"～に遅れる","lesson":"2","ex":"He was late for the meeting again.","exJa":"彼はまた会議に遅刻した。"},{"id":2,"word":"once in a while","meaning":"時々","lesson":"2","ex":"We go hiking once in a while.","exJa":"私たちは時々ハイキングに行く。"},{"id":3,"word":"lose oneself in ～","meaning":"～に没頭する、～に夢中になる","lesson":"2","ex":"She lost herself in the novel.","exJa":"彼女はその小説に夢中になった。"},{"id":4,"word":"be incapable of ...ing","meaning":"...することができない","lesson":"2","ex":"He is incapable of telling a lie.","exJa":"彼は嘘をつくことができない。"},{"id":5,"word":"at one's wit's end","meaning":"途方に暮れて、ほとほと困っている","lesson":"2","ex":"I was at my wit's end trying to fix the computer.","exJa":"パソコンを直そうとして途方に暮れた。"},{"id":6,"word":"be cut out for 〔to be〕 ～","meaning":"～に向いている、～に適している","lesson":"2","ex":"She is cut out for teaching.","exJa":"彼女は教えることに向いている。"},{"id":7,"word":"make a contribution to ～","meaning":"～に貢献〔寄与〕する","lesson":"2","ex":"His research made a great contribution to medicine.","exJa":"彼の研究は医学に大きく貢献した。"},{"id":8,"word":"turn to ～","meaning":"～に頼る、～の方へ向く","lesson":"2","ex":"She turned to her friend for advice.","exJa":"彼女は助言を求めて友人に頼った。"},{"id":9,"word":"be suitable for ～","meaning":"～に適した","lesson":"2","ex":"This movie is not suitable for children.","exJa":"この映画は子供には適していない。"},{"id":10,"word":"in the course of ～","meaning":"～の間に、～の過程で","lesson":"2","ex":"Many things changed in the course of the war.","exJa":"戦争の過程で多くのことが変わった。"},{"id":11,"word":"get ready for ～","meaning":"～の準備をする","lesson":"3","ex":"We need to get ready for the trip.","exJa":"私たちは旅行の準備をする必要がある。"},{"id":12,"word":"on the go","meaning":"（常に忙しく）活動中で","lesson":"3","ex":"She is always on the go with work.","exJa":"彼女は仕事でいつも忙しく動き回っている。"},{"id":13,"word":"in progress","meaning":"進行中で","lesson":"3","ex":"The construction is still in progress.","exJa":"その工事はまだ進行中だ。"},{"id":14,"word":"get in contact with ～","meaning":"～に連絡を取る、～と接触する","lesson":"3","ex":"Please get in contact with our office.","exJa":"私たちの事務所に連 t ease.","exJa":"主人は客たちをくつろがせようとした。"},{"id":29,"word":"not possibly","meaning":"どうしても...ない","lesson":"4","ex":"I cannot possibly finish this by tomorrow.","exJa":"明日までにこれを終わらせることはどうしてもできない。"},{"id":30,"word":"would rather ～ than ...","meaning":"...するよりむしろ～したい","lesson":"4","ex":"I would rather walk than take the bus.","exJa":"バスに乗るよりむしろ歩きたい。"},{"id":31,"word":"the chances are that ...","meaning":"おそらく...だろう","lesson":"5","ex":"The chances are that it will rain tomorrow.","exJa":"明日はおそらく雨だろう。"},{"id":32,"word":"(just) around corner","meaning":"間近に来て","lesson":"5","ex":"Summer vacation is just around the corner.","exJa":"夏休みはもうすぐそこだ。"},{"id":33,"word":"come into effect","meaning":"発効する〔実施される〕","lesson":"5","ex":"The new law will come into effect next month.","exJa":"新しい法律は来月発効する。"},{"id":34,"word":"become of ～","meaning":"～はどうなるのだろうか","lesson":"5","ex":"What will become of the old building?","exJa":"あの古い建物はどうなるのだろうか。"},{"id":35,"word":"at present","meaning":"現在は","lesson":"5","ex":"At present, she is living in Osaka.","exJa":"現在、彼女は大阪に住んでいる。"},{"id":36,"word":"go a long way to ～","meaning":"～に大いに役立つ、効果がある","lesson":"5","ex":"A little kindness goes a long way to make someone happy.","exJa":"ちょっとした親切は人を幸せにするのに大いに役立つ。"},{"id":37,"word":"participate in ～","meaning":"～に参加する","lesson":"5","ex":"Many students participated in the event.","exJa":"多くの学生がそのイベントに参加した。"},{"id":38,"word":"such as ～","meaning":"たとえば～（のような）","lesson":"5","ex":"I like fruits such as apples and oranges.","exJa":"私はリンゴやオレンジのような果物が好きだ。"},{"id":39,"word":"brush up (on) ～","meaning":"～をやり直す","lesson":"5","ex":"I want to brush up on my English before the trip.","exJa":"旅行前に英語をやり直したい。"},{"id":40,"word":"be content with ～","meaning":"～に満足している","lesson":"6","ex":"He is content with his simple life.","exJa":"彼は自分のシンプルな生活に満足している。"},{"id":41,"word":"all of a sudden","meaning":"突然","lesson":"6","ex":"All of a sudden, the lights went out.","exJa":"突然、明かりが消えた。"},{"id":42,"word":"at home","meaning":"家で、本国で","lesson": function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function registerActivity(){
  const t = todayStr();
  if (stats.lastDate === t) { /* already counted today */ }
  else if (stats.lastDate && (new Date(t) - new Date(stats.lastDate)) === DAY_MS) { stats.streak += 1; stats.lastDate = t; }
  else { stats.streak = 1; stats.lastDate = t; }
  stats.history[t] = (stats.history[t] || 0) + 1;
  if (stats.newToday.date !== t) stats.newToday = { date: t, count: 0 };
}

/* ============ SRS LOGIC ============ */
function dueReviewIds(){
  const now = Date.now();
  return Object.keys(progress).filter(id => progress[id].due <= now).map(Number);
}
function newRemainingToday(){
  const t = todayStr();
  const usedToday = (stats.newToday.date === t) ? stats.newToday.count : 0;
  return Math.max(0, settings.dailyNew - usedToday);
}
function unseenIds(limit){
  const out = [];
  for (const w of WORDS){
    if (!progress[w.id]) { out.push(w.id); if (out.length >= limit) break; }
  }
  return out;
}
function masteredCount(){
  return Object.values(progress).filter(p => p.box >= MASTER_BOX).length;
}
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQueue(size){
  const due = dueReviewIds();
  const newBudget = Math.min(newRemainingToday(), Math.max(0, size - due.length));
  const fresh = unseenIds(newBudget);
  let pool = shuffle(due.slice(0, size)).concat(fresh);
  pool = shuffle(pool);
  return pool.slice(0, Math.max(size, pool.length > size ? size : pool.length));
}

function grade(id, result){
  // result: 'again' | 'good' | 'easy'
  let p = progress[id];
  const isNew = !p;
  if (!p) { p = { box: 0, due: Date.now(), reps: 0, lapses: 0, correct: 0, wrong: 0 }; progress[id] = p; }
  if (p.correct === undefined) p.correct = 0;
  if (p.wrong === undefined) p.wrong = 0;
  p.reps += 1;
  if (result === 'again'){
    p.box = 0; p.lapses += 1; p.due = Date.now();
    p.wrong += 1;
  } else if (result === 'good'){
    p.box = Math.min(6, p.box + 1);
    p.due = Date.now() + INTERVALS[p.box] * DAY_MS;
    p.correct += 1;
  } else if (result === 'easy'){
    p.box = Math.min(6, p.box + 2);
    p.due = Date.now() + Math.round(INTERVALS[p.box] * 1.3) * DAY_MS;
    p.correct += 1;
  }
  if (isNew){
    const t = todayStr();
    if (stats.newToday.date !== t) stats.newToday = { date: t, count: 0 };
    stats.newToday.count += 1;
  }
  registerActivity();
  stats.totalReviews += 1;
  saveProgress(); saveStats();
}

function startSession(mode){
  _unseenCache = null;
  const size = settings.sessionSize;
  const queue = buildQueue(size);
  if (queue.length === 0){ alert('現在、出題できる単語がありません。設定から新規枠を増やしてください。'); return; }
  beginSession(queue, mode);
}

function startRangeSession(mode, unmasteredOnly){
  const startId = Math.max(1, Math.min(rangeStartVal, rangeEndVal));
  const endId = Math.min(2300, Math.max(rangeStartVal, rangeEndVal));
  let pool = WORDS.filter(w => w.id >= startId && w.id <= endId);
  if (unmasteredOnly) pool = pool.filter(w => !progress[w.id] || progress[w.id].box < MASTER_BOX);
  const ids = shuffle(pool.map(w => w.id));
  if (ids.length === 0){
    alert(unmasteredOnly ? 'この範囲はすべて定着済みです。' : '指定した範囲に単語が見つかりません。番号を確認してください。');
    return;
  }
  beginSession(ids, mode);
}

function startRetrySession(){
  if (!session || !session.wrongIds || session.wrongIds.size === 0) return;
  const ids = shuffle(Array.from(session.wrongIds));
  const mode = session.mode;
  beginSession(ids, mode);
}

function beginSession(ids, mode){
  _unseenCache = null;
  session = { queue: ids.slice(), pos: 0, mode, correct: 0, total: 0, revealed: false, wrongIds: new Set(), startCount: ids.length };
  route = 'session';

}

function buildChoices(w){
  const others = [];
  while (others.length < 3){
    const rnd = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (rnd.id !== w.id && !others.find(o => o.id === rnd.id)) others.push(rnd);
  }
  return shuffle([{ id: w.id, meaning: w.meaning }, ...others.map(o => ({ id: o.id, meaning: o.meaning }))]);
}

function answer(id, result, isQuiz){
  session.total += 1;
  if (result !== 'again') session.correct += 1;
  else session.wrongIds.add(id);
  grade(id, result);

  if (isQuiz){
    setTimeout(() => { advanceSession(id, result); }, 850);
    render();
    return;
  }
  advanceSession(id, result);
}

function advanceSession(id, result){
  session.revealed = false;
  session.quizChoices = null;
  if (result === 'again'){
    // requeue a few cards later for immediate re-drill
    const insertAt = Math.min(session.queue.length, session.pos + 4);
    session.queue.splice(insertAt, 0, id);
  }
  session.pos += 1;
  render();
}

function renderEnd(){
  const frag = document.createDocumentFragment();
  const wrap = el('div','end-wrap');
  wrap.appendChild(el('div','end-stamp','了'));
  wrap.appendChild(el('div','end-title','本日の学習、完了'));
  wrap.appendChild(el('div','end-sub', session ? (session.total + '問に取り組みました') : ''));

  const statsRow = el('div','end-stats');
  const acc = session && session.total ? Math.round((session.correct / session.total) * 100) : 0;
  statsRow.appendChild(endStat(session ? session.correct : 0, '正解'));
  statsRow.appendChild(endStat(acc + '%', '正答率'));
  statsRow.appendChild(endStat(stats.streak, '連続日数'));
  wrap.appendChild(statsRow);

  const btnRow = el('div');
  btnRow.style.display = 'flex'; btnRow.style.gap = '10px'; btnRow.style.justifyContent = 'center'; btnRow.style.flexWrap = 'wrap';

  if (session && session.wrongIds && session.wrongIds.size > 0){
    const retryBtn = el('button','btn btn-shu','間違えた単語だけ復習する（' + session.wrongIds.size + '語）');
    retryBtn.onclick = () => startRetrySession();
    btnRow.appendChild(retryBtn);
  }

  const btn = el('button','btn btn-outline','ホームへ戻る');
  btn.onclick = () => { session = null; route = 'home'; render(); };
  btnRow.appendChild(btn);
  wrap.appendChild(btnRow);

  frag.appendChild(wrap);
  return frag;
}
function endStat(num, label){
  const d = el('div');
  d.appendChild(el('div','num', String(num)));
  d.appendChild(el('div','lb', label));
  return d;
}

function renderList(){
  const frag = document.createDocumentFragment();
  const bar = el('div','search-bar');
  const input = document.createElement('input');
  input.type = 'text'; input.placeholder = '単語または意味で検索…';
  bar.appendChild(input);
  frag.appendChild(bar);

  const listWrap = el('div');
  frag.appendChild(listWrap);

  function renderRows(query){
    listWrap.innerHTML = '';
    const q = (query || '').trim().toLowerCase();
    let count = 0;
    for (const w of WORDS){
      if (q && !(w.word.toLowerCase().includes(q) || w.meaning.includes(q))) continue;
      const p = progress[w.id];
      const row = el('div','word-row');
      row.appendChild(el('div','w', w.word));
      row.appendChild(el('div','mn', w.meaning));
      row.appendChild(el('span','boxbadge ' + boxClass(p ? p.box : undefined), boxLabel(p ? p.box : undefined)));
      if (p && (p.correct || p.wrong)) row.appendChild(el('span','accbadge', accuracyText(p)));
      listWrap.appendChild(row);
      count++;
      if (count >= 150) break;
    }
    if (count === 0) listWrap.appendChild(el('div','empty-note','該当する単語が見つかりません'));
    else if (count >= 150) listWrap.appendChild(el('div','empty-note','最初の150件を表示中。検索で絞り込んでください。'));
  }
  renderRows('');
  input.oninput = () => renderRows(input.value);

  return frag;
}

/* ============ WORD BOOK (TOC + paginated pages with examples) ============ */
function renderBookToc(){
  const frag = document.createDocumentFragment();
  frag.appendChild(el('div','section-title','目次（100語単位）'));
  const grid = el('div','toc-grid');
  for (let start = 1; start <= MAX_ID; start += BOOK_CHUNK_SIZE){
    const end = Math.min(start + BOOK_CHUNK_SIZE - 1, MAX_ID);
    const chunkWords = WORDS.filter(w => w.id >= start && w.id <= end);
    const count = chunkWords.length;
    const exCount = chunkWords.filter(w => w.ex).length;
    const masteredN = chunkWords.filter(w => progress[w.id] && progress[w.id].box >= MASTER_BOX).length;
    const btn = el('div','toc-item');
    btn.innerHTML = '<div class="toc-range">No.' + start + '〜' + end + '</div>' +
      '<div class="toc-sub">' + count + '語' + (exCount ? '・例文' + exCount + '語' : '') + '</div>' +
      (masteredN ? '<div class="toc-sub" style="color:var(--shu);margin-top:2px;">済 ' + masteredN + '語</div>' : '');
    btn.onclick = () => { bookChunkStart = start; bookChunkEnd = end; bookPageIndex = 0; route = 'bookpage'; render(); };
    grid.appendChild(btn);
  }
  frag.appendChild(grid);
  return frag;
}

function renderBookPage(){
  const frag = document.createDocumentFragment();
  const chunkWords = WORDS.filter(w => w.id >= bookChunkStart && w.id <= bookChunkEnd);
  const totalPages = Math.max(1, Math.ceil(chunkWords.length / BOOK_PAGE_SIZE));
  if (bookPageIndex >= totalPages) bookPageIndex = totalPages - 1;
  if (bookPageIndex < 0) bookPageIndex = 0;
  const pageWords = chunkWords.slice(bookPageIndex * BOOK_PAGE_SIZE, bookPageIndex * BOOK_PAGE_SIZE + BOOK_PAGE_SIZE);

  const crumb = el('div','book-crumb');
  const back = document.createElement('a');
  back.href = 'javascript:void(0)'; back.textContent = '← 目次へ';
  back.onclick = () => { route = 'booktoc'; render(); };
  crumb.appendChild(back);
  crumb.appendChild(el('span','','No.' + bookChunkStart + '〜' + bookChunkEnd + '　' + (bookPageIndex+1) + ' / ' + totalPages + 'ページ'));
  frag.appendChild(crumb);

  const list = el('div','book-list');
  pageWords.forEach(w => {
    const p = progress[w.id];
    const mastered = p && p.box >= MASTER_BOX;
    const card = el('div','book-entry' + (mastered ? ' book-entry-done' : ''));
    const head = el('div','book-head');
    head.appendChild(el('span','book-id','No.' + w.id));
    head.appendChild(el('span','book-word', w.word));
    card.appendChild(head);
    card.appendChild(el('div','book-meaning', w.meaning));
    if (p && (p.correct || p.wrong)) card.appendChild(el('div','book-acc', accuracyText(p)));
    if (w.ex){
      const exBox = el('div','book-example');
      exBox.appendChild(el('div','book-ex-en', w.ex));
      exBox.appendChild(el('div','book-ex-ja', w.exJa));
      card.appendChild(exBox);
    } else {
      card.appendChild(el('div','book-ex-pending','例文は準備中です'));
    }
    if (mastered){
      card.appendChild(el('div','book-stamp','済'));
    }
    list.appendChild(card);
  });
  frag.appendChild(list);

  const nav = el('div','book-nav');
  const prevBtn = el('button','btn btn-outline','← 前のページ');
  prevBtn.disabled = bookPageIndex === 0;
  prevBtn.onclick = () => { bookPageIndex -= 1; render(); window.scrollTo(0,0); };
  const nextBtn = el('button','btn btn-primary','次のページ →');
  nextBtn.disabled = bookPageIndex >= totalPages - 1;
  nextBtn.onclick = () => { bookPageIndex += 1; render(); window.scrollTo(0,0); };
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  frag.appendChild(nav);

  return frag;
}


/* ============ ACCOUNT MODAL ============ */
function openAuthModal(){
  const bg = el('div','modal-bg');
  const m = el('div','modal');

  if (!syncEnabled){
    m.appendChild(el('h3','','アカウント同期は未設定です'));
    m.appendChild(el('p','','このファイルにはまだSupabaseの接続情報（URLとanon key）が設定されていません。コード内のSUPABASE_URLとSUPABASE_ANON_KEYを書き換えると、端末をまたいだログイン・同期が使えるようになります。'));
    const close = el('button','btn btn-primary','閉じる');
    close.onclick = () => bg.remove();
    m.appendChild(close);
    bg.appendChild(m);
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    document.body.appendChild(bg);
    return;
  }

  if (currentUser){
    m.appendChild(el('h3','','マイページ'));
    m.appendChild(el('p','','ログイン中: ' + currentUser.email + '\n\nこのアカウントで単語帳・熟語帳の成績が端末をまたいで同期されます。'));
    const row = el('div','row');
    const close = el('button','btn btn-ghost','閉じる');
    close.onclick = () => bg.remove();
    const out = el('button','btn btn-shu','ログアウト');
    out.onclick = () => { bg.remove(); signOutUser(); };
    row.appendChild(close); row.appendChild(out);
    m.appendChild(row);
    bg.appendChild(m);
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    document.body.appendChild(bg);
    return;
  }

  m.appendChild(el('h3','','ログイン / 新規登録'));
  m.appendChild(el('p','','同じアカウントでログインすると、単語帳・熟語帳の成績を別の端末とも同期できます。'));

  const emailInput = document.createElement('input');
  emailInput.type = 'text'; emailInput.placeholder = 'メールアドレス';
  emailInput.style.cssText = 'width:100%;margin-bottom:8px;box-sizing:border-box;';
  const pwInput = document.createElement('input');
  pwInput.type = 'password'; pwInput.placeholder = 'パスワード（6文字以上）';
  pwInput.style.cssText = 'width:100%;margin-bottom:10px;box-sizing:border-box;';
  m.appendChild(emailInput); m.appendChild(pwInput);

  const errorNote = el('div','', '');
  errorNote.style.cssText = 'color:var(--shu);font-size:12px;margin-bottom:10px;min-height:14px;';
  m.appendChild(errorNote);

  const row = el('div','row');
  const close = el('button','btn btn-ghost','閉じる');
  close.onclick = () => bg.remove();
  const upBtn = el('button','btn btn-outline','新規登録');
  upBtn.onclick = async () => {
    errorNote.textContent = '処理中…';
    const r = await signUp(emailInput.value.trim(), pwInput.value);
    errorNote.textContent = r.error ? r.error : '登録しました。確認メールをご確認ください。';
  };
  const inBtn = el('button','btn btn-primary','ログイン');
  inBtn.onclick = async () => {
    errorNote.textContent = '処理中…';
    const r = await signIn(emailInput.value.trim(), pwInput.value);
    if (r.error) { errorNote.textContent = r.error; }
    else { bg.remove(); }
  };
  row.appendChild(close); row.appendChild(upBtn); row.appendChild(inBtn);
  m.appendChild(row);

  bg.appendChild(m);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

function openSettings(){
  const bg = el('div','modal-bg');
  const m = el('div','modal');
  m.appendChild(el('h3','','設定'));

  const row1 = el('div','settings-row');
  row1.appendChild(el('span','','1日の新規単語数'));
  const sel1 = document.createElement('select');
  [5,10,15,20,30,50].forEach(n => {
    const o = document.createElement('option'); o.value = n; o.textContent = n + '語';
    if (n === settings.dailyNew) o.selected = true;
    sel1.appendChild(o);
  });
  row1.appendChild(sel1);
  m.appendChild(row1);

  const row2 = el('div','settings-row');
  row2.appendChild(el('span','','1回のセッション語数'));
  const sel2 = document.createElement('select');
  [10,20,30,50].forEach(n => {
    const o = document.createElement('option'); o.value = n; o.textContent = n + '語';
    if (n === settings.sessionSize) o.selected = true;
    sel2.appendChild(o);
  });
  row2.appendChild(sel2);
  m.appendChild(row2);

  m.appendChild(el('p','','新規単語数を絞ることで、復習が後回しにならず長期記憶への定着率が上がります（分散学習の原則）。'));

  const resetBtn = el('button','btn-ghost','学習データをすべてリセット');
  resetBtn.style.fontSize = '12px';
  resetBtn.style.marginBottom = '14px';
  resetBtn.style.display = 'block';
  resetBtn.onclick = () => { bg.remove(); confirmReset(); };
  m.appendChild(resetBtn);

  const row = el('div','row');
  const cancel = el('button','btn btn-ghost','閉じる');
  cancel.onclick = () => bg.remove();
  const save = el('button','btn btn-primary','保存');
  save.onclick = async () => {
    settings.dailyNew = Number(sel1.value);
    settings.sessionSize = Number(sel2.value);
    await saveSettings();
    bg.remove();
    render();
  };
  row.appendChild(cancel); row.appendChild(save);
  m.appendChild(row);

  bg.appendChild(m);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

function confirmReset(){
  const bg = el('div','modal-bg');
  const m = el('div','modal');
  m.appendChild(el('h3','','本当にリセットしますか？'));
  m.appendChild(el('p','','これまでの学習履歴・進捗がすべて削除されます。この操作は取り消せません。'));
  const row = el('div','row');
  const cancel = el('button','btn btn-ghost','キャンセル');
  cancel.onclick = () => bg.remove();
  const ok = el('button','btn btn-shu','リセットする');
  ok.onclick = async () => {
    progress = {}; stats = { history: {}, streak: 0, lastDate: null, newToday: { date: null, count: 0 }, totalReviews: 0 };
    _unseenCache = null;
    await saveProgress(); await saveStats();
    bg.remove(); route = 'home'; render();
  };
  row.appendChild(cancel); row.appendChild(ok);
  m.appendChild(row);
  bg.appendChild(m);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* ============ KEYBOARD SHORTCUTS ============ */
document.addEventListener('keydown', (e) => {
  if (route !== 'session' || !session) return;
  const w = currentSessionWord();
  if (!w) return;
  if (session.mode === 'flip'){
    if (!session.revealed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); session.revealed = true; render(); return; }
    if (session.revealed){
      if (e.key === '1') answer(w.id,'again');
      else if (e.key === '2') answer(w.id,'good');
      else if (e.key === '3') answer(w.id,'easy');
    }
  }
});

/* ============ INIT ============ */
(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty-note">読み込み中…</div>';
  await loadAll();
  await initAuth();
  render();
})();
